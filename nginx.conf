

events {
    worker_connections 1024;
}

http {
    # MIME types — tells the browser what type each file is.
    # Without this, .js files are served as text/plain and won't execute.
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Enable gzip compression.
    # Compresses text-based responses (HTML, CSS, JS, JSON).
    # Reduces network transfer by ~70% for JS bundles.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/x-javascript text/xml application/xml
               application/xml+rss text/javascript;
    gzip_min_length 1000; # Don't compress tiny files (overhead not worth it)

    server {
        listen 80;
        server_name _;  # Accept any hostname (works for localhost and real domains)

        root /usr/share/nginx/html;  # Where Vite's build output lives
        index index.html;

        # ── React static files ───────────────────────────────────────
        location / {
            
            try_files $uri $uri/ /index.html;

            # Cache HTML for 0 seconds — browser always revalidates.
            # We want users to always get the latest index.html.
            add_header Cache-Control "no-cache";
        }

        
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # ── Backend API proxy ────────────────────────────────────────
       
        location /api/ {
            # rewrite removes the /api prefix before forwarding
            rewrite ^/api/(.*) /$1 break;

            proxy_pass http://backend:8080;

            # Pass real client headers to the backend
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;


            proxy_read_timeout    90s;
            proxy_connect_timeout 10s;
            proxy_send_timeout    90s;
        }
    }
}
