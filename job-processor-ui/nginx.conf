# nginx.conf — production web server config for the React frontend.
#
# WHY nginx for a React app?
# React builds to static HTML/CSS/JS files. Any static file server works.
# nginx is the industry standard: fast, battle-tested, handles gzip,
# caching headers, and proxying — all things we need here.
#
# WHAT this config does:
# 1. Serves the built React files from /usr/share/nginx/html
# 2. Handles React Router (HTML5 history API): any unknown path
#    returns index.html (we don't use routing, but it's best practice)
# 3. Proxies /api/* to the Spring Boot backend service
#    This is the production equivalent of vite.config.js's proxy —
#    same pattern, different tool.
# 4. Gzip compression reduces transfer sizes by ~70% for JS/CSS

events {
    worker_connections 1024;
}

http {
    # MIME types — tells the browser what type each file is.
    # Without this, .js files are served as text/plain and won't execute.
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Enable gzip compression.
    # Compresses text-based responses (HTML, CSS, JS, JSON).
    # Reduces network transfer by ~70% for JS bundles.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/x-javascript text/xml application/xml
               application/xml+rss text/javascript;
    gzip_min_length 1000; # Don't compress tiny files (overhead not worth it)

    server {
        listen 80;
        server_name _;  # Accept any hostname (works for localhost and real domains)

        root /usr/share/nginx/html;  # Where Vite's build output lives
        index index.html;

        # ── React static files ───────────────────────────────────────
        location / {
            # try_files: look for the exact file first, then the exact
            # directory, then fall back to index.html.
            # This is how React Router (SPA) works — the browser navigates
            # to /jobs/123, nginx can't find that file, returns index.html,
            # React handles the URL client-side.
            try_files $uri $uri/ /index.html;

            # Cache HTML for 0 seconds — browser always revalidates.
            # We want users to always get the latest index.html.
            add_header Cache-Control "no-cache";
        }

        # ── Static assets (JS, CSS, images) ─────────────────────────
        # Vite adds content hashes to filenames (e.g. main.a3f9bc12.js).
        # Content hash = file changes when content changes.
        # So we can cache aggressively — 1 year — safe because the hash
        # in the filename will change when the code changes.
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # ── Backend API proxy ────────────────────────────────────────
        # CRITICAL: This is the production equivalent of vite.config.js proxy.
        # Frontend calls /api/jobs → nginx strips /api → forwards to backend:8080/jobs
        #
        # "backend" is the Docker Compose service name.
        # Docker's internal DNS resolves "backend" to the backend container's IP.
        # This is why Docker Compose services can talk to each other by name.
        location /api/ {
            # rewrite removes the /api prefix before forwarding
            rewrite ^/api/(.*) /$1 break;

            proxy_pass http://backend:8080;

            # Pass real client headers to the backend
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeout settings: jobs take up to 30 s to process.
            # Default nginx timeout is 60 s, so we're fine, but being explicit
            # is better than discovering timeouts in production.
            proxy_read_timeout    90s;
            proxy_connect_timeout 10s;
            proxy_send_timeout    90s;
        }
    }
}
