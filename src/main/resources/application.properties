spring.application.name=job-processor

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/job_processor
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.threads.virtual.enabled=true


# ?? Kafka ?????????????????????????????????????????????????????
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=job-processor-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.LongDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.LongSerializer

# acks=all  ? leader + ALL in-sync replicas acknowledge before producer
#             gets confirmation. No message loss even if leader crashes.
# enable.idempotence=true ? Kafka assigns sequence numbers to messages.
#   Duplicates from producer retries are detected and dropped by the broker.
#   This makes Kafka delivery exactly-once at the producer level.

spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
